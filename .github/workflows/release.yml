name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  tag-version:
    name: tag matches Cargo.toml
    needs: release-please
    if: |
      always() && !cancelled() && !failure() && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || github.ref }}
      - name: Refuse a tag that disagrees with Cargo.toml
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || github.ref_name }}
        run: ./scripts/check-release-tag.sh "$RELEASE_TAG"

  release-build:
    name: release build (${{ matrix.target }})
    needs: [release-please, tag-version]
    if: |
      always() && !cancelled() && needs.tag-version.result == 'success' && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            static: true
          - os: macos-latest
            target: aarch64-apple-darwin
            static: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || github.ref }}
      - name: Read the pinned toolchain
        id: rust
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Add the target to the pinned toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          active="$(rustup show active-toolchain)"
          echo "$active"
          case "$active" in
            1.100.0*) ;;
            *)
              echo "expected the rust-toolchain.toml pin 1.100.0" >&2
              exit 1
              ;;
          esac
          rustup target add "$TARGET"
          rustup target list --installed | grep -F "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build the release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p mnemic
      - name: Require a static musl binary
        if: matrix.static
        run: |
          bin="target/${{ matrix.target }}/release/mnemic"
          file "$bin" | tee "$RUNNER_TEMP/file.txt"
          # Ubuntu 26.04 file(1) prints "static-pie linked" for a static PIE.
          grep -E "statically linked|static-pie linked" "$RUNNER_TEMP/file.txt"
          if grep -F "dynamically linked" "$RUNNER_TEMP/file.txt"; then
            echo "musl binary is dynamically linked" >&2
            exit 1
          fi
      - name: Run --help and --version with no Rust on PATH
        run: |
          set -euo pipefail
          bin="${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/mnemic"
          version="$(awk '
            $0 ~ /^\[workspace\.package\]/ { in_pkg = 1; next }
            in_pkg && $0 ~ /^\[/ { exit }
            in_pkg && /^version[[:space:]]*=/ {
              line = $0
              sub(/^version[[:space:]]*=[[:space:]]*/, "", line)
              gsub(/"/, "", line)
              gsub(/[[:space:]]/, "", line)
              print line
              exit
            }
          ' Cargo.toml)"
          export PATH="/usr/bin:/bin"
          if command -v cargo >/dev/null 2>&1; then
            echo "cargo is still on PATH" >&2
            exit 1
          fi
          if command -v rustc >/dev/null 2>&1; then
            echo "rustc is still on PATH" >&2
            exit 1
          fi
          "$bin" --help
          got="$("$bin" --version)"
          echo "version=${got}"
          test "$got" = "mnemic ${version}"
      - name: Checksum and upload
        run: |
          set -euo pipefail
          name="mnemic-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/mnemic"
          mkdir -p dist
          cp "$bin" "dist/${name}"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$name" > "${name}.sha256"
              sha256sum -c "${name}.sha256"
            else
              shasum -a 256 "$name" > "${name}.sha256"
              shasum -a 256 -c "${name}.sha256"
            fi
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [release-please, release-build]
    if: |
      always() && !cancelled() && needs.release-build.result == 'success' && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          find dist -type f -print
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --verify-tag
          fi

name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # AC5 proof on pull_request and workflow_dispatch. A deliberately wrong tag
  # must fail this script. The tag job below runs the same script on the
  # pushed tag and is the only gate in front of the release build.
  version-mismatch-proof:
    name: version mismatch proof
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: A tag that disagrees with Cargo.toml fails
        run: |
          set +e
          ./scripts/check-release-tag.sh v9.9.9 >"$RUNNER_TEMP/mismatch.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/mismatch.txt"
          echo "exit=${code}"
          test "$code" -ne 0
          grep -F "does not match Cargo.toml version" "$RUNNER_TEMP/mismatch.txt"
      - name: A hostile tag is not expanded and fails
        env:
          RELEASE_TAG: 'v0.1.0$(true)'
        run: |
          set +e
          ./scripts/check-release-tag.sh "$RELEASE_TAG" >"$RUNNER_TEMP/hostile.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/hostile.txt"
          echo "exit=${code}"
          test "$code" -ne 0
          grep -F 'v0.1.0$(true)' "$RUNNER_TEMP/hostile.txt"
      - name: The workspace version passes
        run: |
          set -euo pipefail
          version="$(awk '
            $0 ~ /^\[workspace\.package\]/ { in_pkg = 1; next }
            in_pkg && $0 ~ /^\[/ { exit }
            in_pkg && /^version[[:space:]]*=/ {
              line = $0
              sub(/^version[[:space:]]*=[[:space:]]*/, "", line)
              gsub(/"/, "", line)
              gsub(/[[:space:]]/, "", line)
              print line
              exit
            }
          ' Cargo.toml)"
          test -n "$version"
          ./scripts/check-release-tag.sh "v${version}"

  tag-version:
    name: tag matches Cargo.toml
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a tag that disagrees with Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/check-release-tag.sh "$RELEASE_TAG"

  build-without-publish:
    name: build-without-publish (${{ matrix.target }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            static: true
          - os: macos-latest
            target: aarch64-apple-darwin
            static: false
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned toolchain
        id: rust
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Add the target to the pinned toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          active="$(rustup show active-toolchain)"
          echo "$active"
          case "$active" in
            1.100.0*) ;;
            *)
              echo "expected the rust-toolchain.toml pin 1.100.0" >&2
              exit 1
              ;;
          esac
          rustup target add "$TARGET"
          rustup target list --installed | grep -F "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build the release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p mnemic
      - name: Require a static musl binary
        if: matrix.static
        run: |
          bin="target/${{ matrix.target }}/release/mnemic"
          file "$bin" | tee "$RUNNER_TEMP/file.txt"
          # Ubuntu 26.04 file(1) prints "static-pie linked" for a static PIE.
          grep -E "statically linked|static-pie linked" "$RUNNER_TEMP/file.txt"
          if grep -F "dynamically linked" "$RUNNER_TEMP/file.txt"; then
            echo "musl binary is dynamically linked" >&2
            exit 1
          fi
      - name: Run --help and --version with no Rust on PATH
        run: |
          set -euo pipefail
          bin="${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/mnemic"
          version="$(awk '
            $0 ~ /^\[workspace\.package\]/ { in_pkg = 1; next }
            in_pkg && $0 ~ /^\[/ { exit }
            in_pkg && /^version[[:space:]]*=/ {
              line = $0
              sub(/^version[[:space:]]*=[[:space:]]*/, "", line)
              gsub(/"/, "", line)
              gsub(/[[:space:]]/, "", line)
              print line
              exit
            }
          ' Cargo.toml)"
          export PATH="/usr/bin:/bin"
          if command -v cargo >/dev/null 2>&1; then
            echo "cargo is still on PATH" >&2
            exit 1
          fi
          if command -v rustc >/dev/null 2>&1; then
            echo "rustc is still on PATH" >&2
            exit 1
          fi
          "$bin" --help
          got="$("$bin" --version)"
          echo "version=${got}"
          test "$got" = "mnemic ${version}"
      - name: Check the SHA-256 file
        run: |
          set -euo pipefail
          name="mnemic-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/mnemic"
          mkdir -p dist
          cp "$bin" "dist/${name}"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$name" > "${name}.sha256"
              sha256sum -c "${name}.sha256"
            else
              shasum -a 256 "$name" > "${name}.sha256"
              shasum -a 256 -c "${name}.sha256"
            fi
          )

  release-build:
    name: release build (${{ matrix.target }})
    needs: tag-version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && success()
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            static: true
          - os: macos-latest
            target: aarch64-apple-darwin
            static: false
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned toolchain
        id: rust
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Add the target to the pinned toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          active="$(rustup show active-toolchain)"
          echo "$active"
          case "$active" in
            1.100.0*) ;;
            *)
              echo "expected the rust-toolchain.toml pin 1.100.0" >&2
              exit 1
              ;;
          esac
          rustup target add "$TARGET"
          rustup target list --installed | grep -F "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build the release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p mnemic
      - name: Require a static musl binary
        if: matrix.static
        run: |
          bin="target/${{ matrix.target }}/release/mnemic"
          file "$bin" | tee "$RUNNER_TEMP/file.txt"
          # Ubuntu 26.04 file(1) prints "static-pie linked" for a static PIE.
          grep -E "statically linked|static-pie linked" "$RUNNER_TEMP/file.txt"
          if grep -F "dynamically linked" "$RUNNER_TEMP/file.txt"; then
            echo "musl binary is dynamically linked" >&2
            exit 1
          fi
      - name: Checksum and upload
        run: |
          set -euo pipefail
          name="mnemic-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/mnemic"
          mkdir -p dist
          cp "$bin" "dist/${name}"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$name" > "${name}.sha256"
              sha256sum -c "${name}.sha256"
            else
              shasum -a 256 "$name" > "${name}.sha256"
              shasum -a 256 -c "${name}.sha256"
            fi
          )
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: release-build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          find dist -type f -print
          gh release create "$tag" dist/* \
            --title "$tag" \
            --verify-tag \
            --notes "mnemic ${tag#v}. A person pushed the tag. Each binary has a SHA-256 checksum file beside it."
